version: '3.8'

services:
  # Django Web Application (Development)
  web:
    build: .
    container_name: fullmoon-oj-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./oj_backend:/app
      - ./oj_backend/db.sqlite3:/app/db.sqlite3
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=oj_backend.settings
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    networks:
      - fullmoon-dev-network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

networks:
  fullmoon-dev-network:
    driver: bridge
