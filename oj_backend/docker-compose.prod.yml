version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    volumes:
      # Mount only necessary directories
      - ./db.sqlite3:/app/db.sqlite3:rw
      - ./codes:/app/codes:rw
      - ./media:/app/media:rw
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=oj_backend.settings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
