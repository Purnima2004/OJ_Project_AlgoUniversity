version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.aws
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=oj_backend.settings_aws
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./codes:/app/codes:rw
      - ./media:/app/media:rw
      - ./logs:/var/log/fullmoon_oj:rw
    restart: unless-stopped
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
