# fly.toml — Fly.io app configuration
# See https://fly.io/docs/reference/configuration/ for details

app = 'oj-fullmoon-purnima'
primary_region = 'sin'  # Singapore (closest to India)

[build]
  dockerfile = 'Dockerfile'

[env]
  DJANGO_SETTINGS_MODULE = 'oj_backend.settings'
  IS_PRODUCTION = 'True'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
