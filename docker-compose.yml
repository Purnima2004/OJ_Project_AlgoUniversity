version: '3.8'

services:
  # Django Web Application
  web:
    build: .
    container_name: fullmoon-oj-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./oj_backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=oj_backend.settings
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    depends_on:
      - db
    networks:
      - fullmoon-network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Production Web Service
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: fullmoon-oj-web-prod
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - logs_volume:/app/logs
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=oj_backend.settings
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    depends_on:
      - db
    networks:
      - fullmoon-network
    profiles:
      - production

  # Database (SQLite for development, can be changed to PostgreSQL/MySQL)
  db:
    image: postgres:15-alpine
    container_name: fullmoon-oj-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=fullmoon_oj
      - POSTGRES_USER=fullmoon_user
      - POSTGRES_PASSWORD=fullmoon_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fullmoon-network
    profiles:
      - production

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: fullmoon-oj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - fullmoon-network
    profiles:
      - production

  # Nginx for production (optional)
  nginx:
    image: nginx:alpine
    container_name: fullmoon-oj-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-prod
    networks:
      - fullmoon-network
    profiles:
      - production

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  fullmoon-network:
    driver: bridge
